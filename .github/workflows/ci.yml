name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  msgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt install -y gettext aspell libenchant-2-dev
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('lint-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: uv sync --group lint
      - run: uv run msgcheck -n stdimage/locale/*/LC_MESSAGES/*.po

  lint:
    strategy:
      fail-fast: false
      matrix:
        lint-command:
          - "bandit -r stdimage -x ./tests"
          - "black --check --diff stdimage"
          - "flake8 stdimage"
          - "isort --check-only --diff stdimage"
          - "pydocstyle stdimage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('lint-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: uv sync --group lint
      - run: uv run ${{ matrix.lint-command }}

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt install gettext -y
      - run: uv pip install --upgrade pip build wheel twine readme-renderer
      - run: uv build --sdist --wheel
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          path: dist/*

  pytest:
    runs-on: ubuntu-latest
    needs:
      - lint
      - msgcheck
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        django-version:
          - "5.2"
        extra:
          - "test"
          - "test,progressbar"
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - run: sudo apt install gettext -y
    - uses: actions/checkout@v4
    - run: uv pip install --upgrade pip codecov
    - run: uv pip install -e .[${{ matrix.extra }}]
      if: ${{ matrix.extra }}
    - run: uv pip install django~=${{ matrix.django-version }}a
    - run: uv run pytest
    - run: codecov
